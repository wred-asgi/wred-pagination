[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wred-pagination"
version = "0.1.0"
description = "Optional pagination integration for Wred"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
dependencies = ["wred>=0.13,<0.15"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]
sqlalchemy = ["sqlalchemy[asyncio]>=2.0,<3", "aiosqlite>=0.20", "asyncpg>=0.29"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
